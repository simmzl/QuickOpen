name: Release

# Push a tag like v1.3.0 to build, package and publish a GitHub Release.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v1.3.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          version="${TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - name: Test
        run: swift test

      # Optional: Developer ID signing + notarization.
      # Configure these repository secrets to enable it; without them the build is ad-hoc signed.
      #   MACOS_CERTIFICATE_P12      base64 of a "Developer ID Application" .p12
      #   MACOS_CERTIFICATE_PASSWORD password of that .p12
      #   NOTARY_KEY_P8              base64 of an App Store Connect API key (.p8)
      #   NOTARY_KEY_ID              API key ID
      #   NOTARY_ISSUER_ID           API issuer ID
      - name: Import signing certificate
        id: signing
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE_P12" ]; then
            echo "No signing certificate configured; using ad-hoc signing."
            echo "identity=-" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)"
          echo "identity=$identity" >> "$GITHUB_OUTPUT"

      - name: Prepare notarization key
        id: notary
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          if [ -n "$NOTARY_KEY_P8" ]; then
            echo "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
            echo "key=$RUNNER_TEMP/notary.p8" >> "$GITHUB_OUTPUT"
          fi

      - name: Build dmg and zip
        env:
          QUICKOPEN_VERSION: ${{ steps.version.outputs.version }}
          QUICKOPEN_BUILD_NUMBER: ${{ github.run_number }}
          QUICKOPEN_SKIP_ICON: "1"
          QUICKOPEN_SIGNING_IDENTITY: ${{ steps.signing.outputs.identity }}
          QUICKOPEN_NOTARY_KEY: ${{ steps.notary.outputs.key }}
          QUICKOPEN_NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          QUICKOPEN_NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
        run: ./scripts/build-dmg.sh

      - name: Release notes
        run: |
          version="${{ steps.version.outputs.version }}"
          # Use the matching section of CHANGELOG.md when present.
          awk -v v="$version" '
            $0 ~ "^## \\[?v?"v"\\]?" {found=1; next}
            found && /^## / {exit}
            found {print}
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md" || true
          if [ "${{ steps.signing.outputs.identity }}" = "-" ]; then
            {
              printf '\n---\n'
              printf '> **First launch:** this build is not notarized. Right-click QuickOpen in Applications → **Open**, or run `xattr -dr com.apple.quarantine /Applications/QuickOpen.app`.\n>\n'
              printf '> **首次打开：** 此版本未经 Apple 公证。请在“应用程序”中右键点 QuickOpen →「打开」。\n'
            } >> "$RUNNER_TEMP/notes.md"
          fi
          {
            echo
            echo "**SHA-256**"
            echo '```'
            cat "dist/QuickOpen-$version.sha256"
            echo '```'
          } >> "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          flags=()
          [ "${{ steps.version.outputs.prerelease }}" = "true" ] && flags+=(--prerelease)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber \
              "dist/QuickOpen-$version.dmg" "dist/QuickOpen-$version.zip" "dist/QuickOpen-$version.sha256"
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" \
              --title "QuickOpen $version" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              "${flags[@]}" \
              "dist/QuickOpen-$version.dmg" "dist/QuickOpen-$version.zip" "dist/QuickOpen-$version.sha256"
          fi

      - name: Clean up keychain
        if: always()
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          [ -f "$keychain" ] && security delete-keychain "$keychain" || true
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/notary.p8"
